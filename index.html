<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moja prva stran</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }

    main {
      max-width: 600px;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    p {
      font-size: 1.125rem;
      line-height: 1.6;
      color: #4a4a4a;
      margin-bottom: 32px;
    }

    button {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <main>
    <h1>Živjo, svet!</h1>
    <p>To je moja prva spletna stran, zgrajena z vibe codingom.</p>
    <button onclick="alert('Bravo! Vse deluje.')">Deluje!</button>
  </main>
</body>
</html>
